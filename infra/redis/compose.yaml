name: laughtale-redis-lab
services:
  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    user: redis
    env_file: ../../.artifacts/chat-distributed/secrets/redis.env
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction --appendonly no --save ""'
    ports: ["127.0.0.1:19079:6379"]
    networks: [lab]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    restart: "no"
    read_only: true
    tmpfs: ["/data:rw,noexec,nosuid,size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 2s
      retries: 5
networks:
  lab:
    external: true
    name: laughtale-postgres-lab_default
