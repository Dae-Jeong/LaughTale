# Explicit E3 experiment only. Root applies AFTER A1 idle baseline passes.
# Do not install alongside another HPA targeting chat. Do not lower CPU target
# merely to cause an idle scale-up. The runner never writes replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-growth
  namespace: laughtale-chat-external
  labels:
    app.kubernetes.io/part-of: laughtale-chat-external
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - {type: Pods, value: 1, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
