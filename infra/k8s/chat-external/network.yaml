apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-services
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [chat, platform-mock, traffic-generator]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [chat, platform-mock, traffic-generator]}
      ports: [{protocol: TCP, port: 18082}, {protocol: TCP, port: 18087}]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [chat, platform-mock]}
      ports: [{protocol: TCP, port: 18082}, {protocol: TCP, port: 18087}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-lab-database
spec:
  podSelector: {matchLabels: {app: chat}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 172.22.0.2/32}
        - ipBlock: {cidr: 172.22.0.3/32}
      ports: [{protocol: TCP, port: 5432}]
