apiVersion: v1
kind: Pod
metadata:
  name: chat-cluster-probe
  namespace: laughtale-chat-external
  labels: {app: traffic-generator, experiment: cluster-probe}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 900
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: probe
      image: laughtale-chat:auth-metrics-v1
      imagePullPolicy: Never
      command: [python, -c, "import time; time.sleep(850)"]
      env:
        - name: LAB_INGRESS_TOKEN
          valueFrom:
            secretKeyRef: {name: chat-growth-env, key: LAB_INGRESS_TOKEN}
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: source, mountPath: /probe, readOnly: true}
  volumes:
    - name: source
      configMap: {name: chat-cluster-probe-source}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-probe-egress
  namespace: laughtale-chat-external
spec:
  podSelector: {matchLabels: {experiment: cluster-probe}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chat-gateway}}
      ports: [{protocol: TCP, port: 18082}]
    - to:
        - ipBlock: {cidr: 172.22.0.5/32}
      ports: [{protocol: TCP, port: 9092}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-cluster-probe
  namespace: laughtale-chat-external
spec:
  podSelector: {matchLabels: {app: chat-gateway}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {experiment: cluster-probe}}
      ports: [{protocol: TCP, port: 18082}]
