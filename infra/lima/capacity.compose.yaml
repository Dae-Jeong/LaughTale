name: laughtale-capacity

x-postgres: &postgres
  image: laughtale-capacity-postgres:v2
  mem_limit: 768m
  memswap_limit: 768m
  cpus: 1
  shm_size: 128m
  restart: "no"
  stop_grace_period: 60s
  logging: &logging
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

services:
  primary:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: laughtale_chat
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CHAT_WRITER_PASSWORD: ${CHAT_WRITER_PASSWORD:?required}
      CHAT_READER_PASSWORD: ${CHAT_READER_PASSWORD:?required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?required}
    volumes: [primary-data:/var/lib/postgresql/data]
    networks:
      lab: {ipv4_address: 172.28.0.2}
    command: [postgres, -c, hba_file=/etc/postgresql/lab_hba.conf,
      -c, shared_buffers=192MB, -c, max_connections=60, -c, wal_level=replica,
      -c, max_wal_senders=4, -c, max_replication_slots=2,
      -c, max_slot_wal_keep_size=4GB, -c, max_wal_size=2GB, -c, wal_keep_size=256MB]
    healthcheck:
      test: [CMD-SHELL, "psql -U postgres -d laughtale_chat -Atqc \"SELECT 1 FROM pg_replication_slots WHERE slot_name='chat_replica'\" | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  replica:
    <<: *postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPASSWORD: ${REPLICATION_PASSWORD:?required}
      REPLICA_MAX_CONNECTIONS: "60"
      REPLICA_SHARED_BUFFERS: 192MB
    volumes: [replica-data:/var/lib/postgresql/data]
    networks:
      lab: {ipv4_address: 172.28.0.3}
    depends_on:
      primary: {condition: service_healthy}
    entrypoint: [sh, /opt/lab/replica.sh]
    healthcheck:
      test: [CMD-SHELL, "psql -U postgres -d laughtale_chat -Atqc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
    hostname: kafka
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    restart: "no"
    stop_grace_period: 60s
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      lab: {ipv4_address: 172.28.0.5}
    volumes: [kafka-data:/var/lib/kafka/data]
    environment:
      CLUSTER_ID: lxS3yiSJTxmpqmXrCXca8A
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://172.28.0.5:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Preserve evidence through the long run; the disk guard must stop producers.
      KAFKA_LOG_RETENTION_HOURS: "-1"
      KAFKA_LOG_RETENTION_BYTES: "-1"
      KAFKA_LOG_SEGMENT_BYTES: "268435456"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly no --save ""']
    networks:
      lab: {ipv4_address: 172.28.0.6}
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    restart: "no"
    read_only: true
    tmpfs: ["/data:rw,noexec,nosuid,size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  primary-data:
  replica-data:
  kafka-data:
networks:
  lab:
    name: laughtale-capacity
    ipam:
      config: [{subnet: 172.28.0.0/24, ip_range: 172.28.0.128/25}]
