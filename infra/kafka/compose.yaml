name: laughtale-kafka-lab

services:
  kafka:
    image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
    hostname: kafka
    cpus: 0.75
    mem_limit: 768m
    memswap_limit: 768m
    restart: "no"
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:19092:19092"
    networks:
      lab:
        aliases: [kafka]
    environment:
      CLUSTER_ID: iUGMOcVE-oWP_33xBzZo6Q
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "268435456"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_ROLL_MS: "3600000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "60000"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

volumes:
  kafka-data:

networks:
  lab:
    external: true
    name: laughtale-postgres-lab_default
