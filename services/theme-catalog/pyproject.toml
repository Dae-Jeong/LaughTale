[project]
name = "laughtale-theme-catalog"
version = "0.1.0"
description = "Laughtale synthetic theme catalog read/caching experiment service (LAUGH-KNOWLEDGE-READ-001)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "theme_catalog"
source-include = ["src/theme_catalog/fixtures/*.json"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers --tb=short"
filterwarnings = [
    "error",
    # Starlette 1.6.0의 별칭 참조입니다. 수정 릴리스 도입 후 제거합니다.
    'default:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:starlette\.testclient',
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]
