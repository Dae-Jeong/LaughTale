[project]
name = "platform-mock"
version = "0.1.0"
description = "Bounded local synthetic platform simulator"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "platform-contracts",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
platform-mock = "platform_mock.run:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
platform-contracts = { path = "../../contracts/platform-simulator" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
